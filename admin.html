<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0F0E1A" />
<title>Sonare — Painel Admin</title>
<link rel="manifest" href="./manifest-admin.webmanifest" />
<link rel="icon" type="image/png" href="assets/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/sonare-features.css" />
<style>
/* === LOGO === */
.admin-logo-wrap { width: 100%; max-width: 520px; margin: 16px auto 12px; padding: 0 16px; }
.admin-logo-wrap img { width: 100%; height: auto; display: block; }

/* === EDITOR RICO MOBILE-FIRST === */
.editor-toolbar {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 8px;
  padding: 8px;
  background: var(--ink-3);
  border-radius: 8px 8px 0 0;
  border: 1px solid var(--ink-3);
  border-bottom: none;
}
.editor-toolbar button {
  min-width: 44px;
  min-height: 44px;
  padding: 8px 12px;
  background: var(--ink-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--cream);
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.editor-toolbar button:hover, .editor-toolbar button:active { background: var(--gold); color: var(--ink); }
.editor-toolbar button.active { background: var(--gold); color: var(--ink); }
.editor-toolbar .sep { width: 1px; background: var(--border); margin: 4px 4px; }
.editor-toolbar .label { color: var(--cream-dim); padding: 12px 8px; font-family: var(--mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .12em; }

.editor-area {
  min-height: 200px;
  padding: 14px 16px;
  background: var(--ink);
  border: 1px solid var(--ink-3);
  border-radius: 0 0 8px 8px;
  color: var(--cream);
  font-size: 1rem;
  line-height: 1.6;
  outline: none;
}
.editor-area:focus { border-color: var(--gold); }
.editor-area h1, .editor-area h2, .editor-area h3 { font-family: var(--serif); color: var(--gold); font-weight: 400; margin: 12px 0 8px; }
.editor-area h1 { font-size: 1.6rem; }
.editor-area h2 { font-size: 1.3rem; }
.editor-area h3 { font-size: 1.1rem; }
.editor-area p { margin: 8px 0; }
.editor-area ul, .editor-area ol { margin: 8px 0; padding-left: 24px; }
.editor-area li { margin: 4px 0; }
.editor-area a { color: var(--cyan); text-decoration: underline; word-break: break-all; }
.editor-area blockquote { border-left: 3px solid var(--gold); padding: 8px 16px; margin: 12px 0; color: var(--cream-dim); font-style: italic; }
.editor-area pre { background: var(--ink-3); padding: 12px; border-radius: 6px; font-family: var(--mono); font-size: .9rem; overflow-x: auto; margin: 8px 0; }
.editor-area code { background: var(--ink-3); padding: 2px 6px; border-radius: 3px; font-family: var(--mono); font-size: .9em; }

/* Inputs de campo no editor */
.editor-field { margin-bottom: 14px; }
.editor-field label {
  display: block;
  font-family: var(--mono);
  font-size: .7rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--cream-dim);
  margin-bottom: 6px;
}
.editor-field input {
  width: 100%;
  padding: 12px 14px;
  background: var(--ink);
  border: 1px solid var(--ink-3);
  border-radius: 8px;
  color: var(--cream);
  font-size: 1rem;
}
.editor-field input:focus { outline: none; border-color: var(--gold); }

/* Botões mobile-first grandes */
.btn-big {
  min-height: 48px;
  padding: 14px 24px;
  font-size: 1rem;
  border-radius: 999px;
  font-weight: 600;
}
@media (max-width: 600px) {
  .admin-tabs { flex-wrap: wrap; }
  .admin-tab { flex: 1 1 45%; text-align: center; }
  .editor-toolbar button { min-width: 48px; min-height: 48px; }
}
</style>
</head>
<body>

<div id="login-screen" class="app" style="display:none;">
  <div class="code-entry" style="max-width: 420px; margin: 80px auto;">
    <h2>🔒 Painel Admin</h2>
    <p>Digite a senha para acessar.</p>
    <input class="code-entry__input" id="admin-password" type="password" placeholder="••••••••" autocomplete="off" style="letter-spacing: 0.3em; text-align: center;" />
    <button class="btn btn--gold btn--block" id="admin-enter" style="margin-top: 12px;">Entrar</button>
    <div class="code-entry__error" id="admin-error"></div>
  </div>
</div>

<div id="app" class="app" style="display:none;">
  <div style="text-align: center; padding: 60px 20px; color: var(--cream-dim);">
    Carregando painel admin...
  </div>
</div>

<script>
  // Senha fixa do admin (mude aqui se quiser)
  window.SONARE_ADMIN_PASSWORD = 'TROCAR-SENHA'; // senha real removida do repositório — será substituída por login Firebase

  // Garante que o conteúdo do admin só carrega após validar senha
  (function() {
    const loginScreen = document.getElementById('login-screen');
    const appScreen = document.getElementById('app');
    const input = document.getElementById('admin-password');
    const btn = document.getElementById('admin-enter');
    const err = document.getElementById('admin-error');

    function showError(msg) {
      err.textContent = msg;
      setTimeout(() => { err.textContent = ''; }, 3000);
    }

    function tryEnter() {
      const senha = input.value;
      if (senha === window.SONARE_ADMIN_PASSWORD) {
        sessionStorage.setItem('sonare-admin-auth', '1');
        loginScreen.style.display = 'none';
        appScreen.style.display = '';
      } else {
        showError('Senha incorreta.');
        input.value = '';
        input.focus();
      }
    }

    // Se já logou nesta sessão, pula login
    if (sessionStorage.getItem('sonare-admin-auth') === '1') {
      loginScreen.style.display = 'none';
      appScreen.style.display = '';
    } else {
      loginScreen.style.display = '';
      appScreen.style.display = 'none';
      setTimeout(() => input.focus(), 100);
    }

    btn.addEventListener('click', tryEnter);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryEnter(); });
  })();
</script>

<script src="js/db.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-sync.js"></script>
<script src="js/alarm.js"></script>
<script src="js/conteudo.js"></script>
<script src="js/sonare-data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
