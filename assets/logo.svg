<!-- Logo SONARE — usado na tela de login do aluno e no admin -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#f5e6a3;stop-opacity:1" />
      <stop offset="25%"  style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="50%"  style="stop-color:#b8962e;stop-opacity:1" />
      <stop offset="75%"  style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B7520;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#c77dff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b2fbe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077b6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <line x1="60" y1="150" x2="100" y2="150" stroke="#d4af37" stroke-width="2" filter="url(#shadow)"/>

  <!-- Esquerda (roxo) — 10 barras -->
  <g filter="url(#shadow)">
    <rect x="105" y="145" width="4" height="10"  rx="2"   fill="url(#purpleGrad)"/>
    <rect x="113" y="140" width="4" height="20"  rx="2"   fill="url(#purpleGrad)"/>
    <rect x="121" y="135" width="5" height="30"  rx="2.5" fill="url(#purpleGrad)"/>
    <rect x="130" y="128" width="5" height="44"  rx="2.5" fill="url(#purpleGrad)"/>
    <rect x="139" y="120" width="6" height="60"  rx="3"   fill="url(#purpleGrad)"/>
    <rect x="149" y="112" width="6" height="76"  rx="3"   fill="url(#purpleGrad)"/>
    <rect x="159" y="105" width="7" height="90"  rx="3.5" fill="url(#purpleGrad)"/>
    <rect x="170" y="98"  width="7" height="104" rx="3.5" fill="url(#purpleGrad)"/>
    <rect x="181" y="92"  width="8" height="116" rx="4"   fill="url(#purpleGrad)"/>
    <rect x="193" y="88"  width="8" height="124" rx="4"   fill="url(#purpleGrad)"/>
  </g>

  <!-- Centro: bola + haste + pestana (a "guitarra" estilizada) -->
  <g filter="url(#shadow)">
    <!-- Pestana (cabeça) acima da bola -->
    <rect x="293" y="78" width="4" height="55" rx="2" fill="url(#goldGrad)"/>
    <!-- Bola/Corpo (elipse inclinada) -->
    <ellipse cx="275" cy="170" rx="22" ry="18" fill="url(#goldGrad)" transform="rotate(-15, 275, 170)"/>
    <!-- Contorno do corpo em forma de cabeça de guitarra -->
    <path d="M 280 130
             C 260 130, 245 145, 245 165
             C 245 185, 260 200, 280 200
             C 300 200, 315 190, 320 175
             C 325 160, 320 145, 310 135
             C 305 130, 298 127, 290 127
             C 282 128, 280 130, 280 130 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Direita (ciano) — 10 barras -->
  <g filter="url(#shadow)">
    <rect x="380" y="88"  width="8" height="124" rx="4"   fill="url(#blueGrad)"/>
    <rect x="392" y="92"  width="8" height="116" rx="4"   fill="url(#blueGrad)"/>
    <rect x="404" y="98"  width="7" height="104" rx="3.5" fill="url(#blueGrad)"/>
    <rect x="415" y="105" width="7" height="90"  rx="3.5" fill="url(#blueGrad)"/>
    <rect x="425" y="112" width="6" height="76"  rx="3"   fill="url(#blueGrad)"/>
    <rect x="435" y="120" width="6" height="60"  rx="3"   fill="url(#blueGrad)"/>
    <rect x="444" y="128" width="5" height="44"  rx="2.5" fill="url(#blueGrad)"/>
    <rect x="453" y="135" width="5" height="30"  rx="2.5" fill="url(#blueGrad)"/>
    <rect x="461" y="140" width="4" height="20"  rx="2"   fill="url(#blueGrad)"/>
    <rect x="469" y="145" width="4" height="10"  rx="2"   fill="url(#blueGrad)"/>
  </g>

  <line x1="480" y1="150" x2="520" y2="150" stroke="#d4af37" stroke-width="2" filter="url(#shadow)"/>

  <text x="300" y="245" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="36"
        font-weight="bold"
        letter-spacing="8"
        fill="url(#goldGrad)"
        filter="url(#shadow)">
    — SONARE —
  </text>
</svg>
